<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#7ed2fb" />
  <title>Ролл вверх</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #7ed2fb;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      user-select: none; touch-action: none;
      overscroll-behavior: none;
      color: #fff;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: absolute; inset: 0; z-index: 4; pointer-events: none;
      padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    }
    #hud-top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    }
    #hud-left, #hud-right { display: flex; flex-direction: column; gap: 8px; min-width: 86px; }
    #hud-right { align-items: flex-end; }
    #hud-center { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
    .pill {
      background: linear-gradient(180deg, rgba(255,255,255,.96) 0%, rgba(255,244,230,.84) 100%);
      color: #4a2c18;
      border-radius: 999px;
      padding: 7px 14px;
      font-weight: 800;
      font-size: clamp(14px, 3.6vw, 18px);
      border: 1.5px solid rgba(255,255,255,.9);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        0 4px 0 rgba(196, 140, 72, .18),
        0 10px 22px rgba(40, 16, 24, .16);
      display: inline-flex; align-items: center; gap: 7px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .pill.dark {
      background: linear-gradient(180deg, rgba(62, 42, 32, .48), rgba(28, 18, 16, .52));
      color: #fff8ee;
      border: 1px solid rgba(255, 220, 170, .22);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 6px 16px rgba(0,0,0,.22);
      backdrop-filter: blur(10px);
    }
    .pill.pink { color: #e23d6d; }
    #score-wrap { position: relative; }
    #score {
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 900;
      color: #ff2d78;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
      padding: 6px 22px 8px;
      min-width: 2.6em;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, #ffe4f0 100%);
      border: 2px solid #ffd56a;
      text-shadow: 0 2px 0 rgba(180,20,80,.18);
      box-shadow:
        inset 0 1px 0 #fff,
        0 5px 0 rgba(255, 80, 140, .2),
        0 12px 24px rgba(255, 45, 120, .16);
    }
    #score-pop {
      position: absolute; left: 50%; top: 100%;
      transform: translate(-50%, -4px);
      font-weight: 900; font-size: 18px; color: #ff4d8d;
      text-shadow: 0 2px 0 #fff, 0 3px 8px rgba(0,0,0,.25);
      opacity: 0; pointer-events: none;
    }
    #score-pop.show { animation: popgain 0.7s ease-out forwards; }
    @keyframes popgain {
      0% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -22px) scale(1); }
    }
    #flow {
      display: none;
      background: linear-gradient(180deg, #d7b8ff, #8a5cff);
      color: #fff;
      border-color: rgba(255,255,255,.45);
      text-shadow: 0 2px 0 rgba(60,20,120,.35);
    }
    #flow.on { display: inline-flex; animation: flowpulse 0.9s ease-in-out infinite; }
    @keyframes flowpulse { 50% { transform: scale(1.06); } }
    #lives { letter-spacing: 2px; font-size: clamp(16px, 4.2vw, 22px); filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
    #hint {
      position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(40, 28, 22, .42), rgba(20, 14, 18, .46));
      border: 1px solid rgba(255, 230, 190, .2);
      padding: 8px 16px; border-radius: 999px;
      font-weight: 700; font-size: 13px;
      text-align: center; max-width: 88vw;
      text-shadow: 0 1px 4px #000;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 8px 18px rgba(0,0,0,.18);
      backdrop-filter: blur(8px);
    }
    #banner {
      position: absolute; left: 50%; top: 28%;
      transform: translate(-50%, -40px);
      z-index: 6; pointer-events: none;
      background: linear-gradient(180deg, #fff3b0, #ffc44a 55%, #f0a020);
      color: #4a1a08;
      font-weight: 900;
      font-size: clamp(16px, 4.4vw, 22px);
      padding: 12px 22px;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,.55);
      box-shadow: inset 0 1px 0 #fff8d8, 0 6px 0 #c67c00, 0 12px 24px rgba(0,0,0,.28);
      opacity: 0;
      white-space: nowrap;
    }
    #banner.show { animation: bannerslide 2.6s ease forwards; }
    @keyframes bannerslide {
      0% { opacity: 0; transform: translate(-50%, -50px) scale(.9); }
      12% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      78% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -16px) scale(.98); }
    }
    #overlay {
      position: absolute; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse 90% 55% at 50% 8%, rgba(255,255,255,.42), transparent 58%),
        linear-gradient(180deg, rgba(126, 210, 248, .58) 0%, rgba(255, 214, 186, .4) 46%, rgba(32, 52, 96, .58) 100%);
      text-align: center; padding: 24px 18px 40px;
      cursor: pointer;
    }
    #overlay.hidden { display: none; }
    #overlay.lose {
      background:
        radial-gradient(ellipse 80% 50% at 50% 10%, rgba(255, 180, 200, .28), transparent 55%),
        linear-gradient(180deg, rgba(110, 48, 78, .78) 0%, rgba(36, 14, 32, .86) 100%);
    }
    #roll-ico {
      width: 96px; height: 96px; border-radius: 50%;
      margin-bottom: 14px;
      background:
        radial-gradient(circle at 50% 50%, #f2744a 0 20%, #fff6ea 21% 60%, #1f4a2e 61% 100%);
      box-shadow:
        0 8px 0 rgba(0,0,0,.18),
        0 16px 28px rgba(20, 40, 20, .22),
        inset 0 0 0 3px #163824,
        inset 0 -10px 12px rgba(0,0,0,.12);
      position: relative;
    }
    #roll-ico .eye {
      position: absolute; top: 38%; width: 15%; height: 20%;
      background: #fff;
      border-radius: 50%;
      box-shadow: inset 0 -1px 0 rgba(0,0,0,.08);
    }
    #roll-ico .eye:after {
      content: ""; position: absolute; left: 28%; top: 28%;
      width: 46%; height: 46%; border-radius: 50%; background: #2a1810;
    }
    #roll-ico .eye.left { left: 26%; }
    #roll-ico .eye.right { right: 26%; }
    #roll-ico:after {
      content: ""; position: absolute; left: 16%; top: 14%;
      width: 22%; height: 12%; border-radius: 50%;
      background: rgba(255,255,255,.4);
      pointer-events: none;
    }
    #overlay h1 {
      font-size: clamp(36px, 10vw, 64px);
      font-weight: 900;
      letter-spacing: 0.5px;
      line-height: 1;
      color: #fffdf6;
      text-shadow:
        0 1px 0 #fff,
        0 3px 0 #f0c258,
        0 7px 0 rgba(180, 90, 24, .28),
        0 14px 28px rgba(40, 20, 0, .28);
      margin-bottom: 8px;
    }
    #overlay .tag {
      font-size: clamp(16px, 4.2vw, 22px);
      font-weight: 800;
      color: #fff3c4;
      text-shadow: 0 2px 0 #8a4a10;
      margin-bottom: 10px;
    }
    #overlay .msg {
      font-size: clamp(15px, 3.6vw, 20px);
      line-height: 1.4;
      max-width: 22em;
      color: #eef8ff;
      text-shadow: 0 2px 8px rgba(0,0,0,.35);
      margin-bottom: 8px;
    }
    #overlay .stats {
      font-size: clamp(16px, 3.8vw, 22px);
      font-weight: 800;
      color: #ffe08a;
      margin: 8px 0 16px;
      text-shadow: 0 2px 6px #000;
    }
    #overlay .go {
      display: inline-block;
      margin-top: 6px;
      border: 2px solid rgba(255,255,255,.55); border-radius: 999px;
      padding: 14px 36px;
      font-size: clamp(18px, 4.4vw, 26px);
      font-weight: 900;
      font-family: inherit;
      color: #4a1208;
      background: linear-gradient(180deg, #fff6c4 0%, #ffd24a 46%, #f0a018 100%);
      box-shadow:
        inset 0 1px 0 #fff8d8,
        0 6px 0 #c47800,
        0 14px 28px rgba(0,0,0,.28);
      animation: pulse 1.2s ease-in-out infinite;
    }
    #overlay .help {
      margin-top: 18px;
      font-size: 13px;
      color: #d6ecff;
      opacity: .95;
      max-width: 22em;
      line-height: 1.45;
    }
    @keyframes pulse { 50% { opacity: .78; transform: scale(1.04); } }
    #hurtflash {
      position: absolute; inset: 0; z-index: 7; pointer-events: none;
      background: rgba(220, 30, 60, .0);
      transition: background .15s linear;
    }
    #hurtflash.on { background: rgba(220, 30, 60, .38); }
  </style>
</head>
<body>
  <div id="hud">
    <div id="hud-top">
      <div id="hud-left">
        <div class="pill pink" id="roe-pill">● <span id="roe">0</span></div>
        <div class="pill" id="flow">ФЛОУ ×<span id="flow-n">1</span></div>
      </div>
      <div id="hud-center">
        <div id="score-wrap">
          <div class="pill" id="score">0000</div>
          <div id="score-pop"></div>
        </div>
        <div class="pill dark" id="lives">❤ ❤ ❤</div>
      </div>
      <div id="hud-right">
        <div class="pill dark" id="alt">↑ 0М</div>
      </div>
    </div>
    <div id="hint">Свайп влево-вправо · A / D · стрелки</div>
  </div>
  <div id="banner"></div>
  <div id="hurtflash"></div>
  <div id="overlay">
    <div id="roll-ico"><span class="eye left"></span><span class="eye right"></span></div>
    <h1>РОЛЛ ВВЕРХ</h1>
    <div class="tag">Крути башню · ролл прыгает сам</div>
    <p class="msg" id="ovMsg">Крути цилиндр, чтобы площадка оказалась под роллом. Не прыгай — он прыгает сам. Колючки и булавы — мимо.</p>
    <div class="stats" id="ovStats"></div>
    <div class="go" id="ovGo">Нажми, чтобы начать</div>
    <p class="help">Телефон: веди пальцем влево-вправо<br/>Клавиатура: A / D или ← →</p>
  </div>
  <script src="three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
